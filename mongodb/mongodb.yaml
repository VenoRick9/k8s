apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: innowise
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: cm9vdHVzZXI=
  MONGO_INITDB_ROOT_PASSWORD: cm9vdHBhc3M=

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: innowise
data:
  MONGO_INITDB_DATABASE: "payment_db"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: innowise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_INITDB_DATABASE
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: innowise
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
