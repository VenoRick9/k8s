apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth-secret
  namespace: innowise
type: Opaque
data:
  POSTGRES_PASSWORD: UG9zdGdyZXNfOQ==

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-auth-config
  namespace: innowise
data:
  POSTGRES_DB: "auth_service"
  POSTGRES_USER: "postgres"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: innowise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-auth-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-auth-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-auth-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-auth-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: innowise
spec:
  type: ClusterIP
  selector:
    app: postgres-auth
  ports:
    - port: 5432
      targetPort: 5432
