apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: innowise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.3.0
          ports:
            - containerPort: 2181
          envFrom:
            - configMapRef:
                name: zookeeper-config
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
      volumes:
        - name: zookeeper-data
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: innowise
spec:
  type: ClusterIP
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
