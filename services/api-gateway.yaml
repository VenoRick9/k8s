apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: innowise
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: pandarick9/apigateway:854466ddd7315e0f0eefb5a967d13b149bc51eb3
          ports:
            - containerPort: 7070
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: JWT_SECRET_ACCESS
              value: "U2VjcmV0S2V5Rm9yQWNjZXNzVG9rZW5BdXRoU2VydmljZQ=="
            - name: USER_SERVICE_URL
              value: "http://user-service:8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8079"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8078"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8077"
            - name: GATEWAY_PUBLIC_PATHS
              value: "/auth/login,/auth/registration,/auth/refresh"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /gateway/actuator/health/readiness
              port: 7070

          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /gateway/actuator/health/liveness
              port: 7070

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: innowise
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 7070
      targetPort: 7070

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: innowise
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  rules:
    - host: api.innowise.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 7070


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: innowise
data:
  application-docker.properties: |
    jwt.secret.access=U2VjcmV0S2V5Rm9yQWNjZXNzVG9rZW5BdXRoU2VydmljZQ==
    user.service.url=http://user-service:8080
    auth.service.url=http://auth-service:8079
    order.service.url=http://order-service:8078
    payment.service.url=http://payment-service:8077
    gateway.public-paths=/auth/login,/auth/registration,/auth/refresh