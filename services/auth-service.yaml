apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: innowise
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: pandarick9/authenticationservice:9dc3d7274a2e8bd92c343c797c583aa0a801265c
          ports:
            - containerPort: 8079
          env:
            - name: SERVER_PORT
              value: "8079"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-auth:5432/auth_service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "Postgres_9"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "true"
            - name: JWT_SECRET_ACCESS
              value: "U2VjcmV0S2V5Rm9yQWNjZXNzVG9rZW5BdXRoU2VydmljZQ=="
            - name: JWT_SECRET_REFRESH
              value: "U2VjcmV0S2V5Rm9yUmVmcmVzaFRva2VuQXV0aFNlcnZpY2U="
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /auth/actuator/health/readiness
              port: 8079

          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /auth/actuator/health/liveness
              port: 8079


---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: innowise
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8079
      targetPort: 8079
---
